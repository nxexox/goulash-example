name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: goulash
          POSTGRES_PASSWORD: goulash
          POSTGRES_DB: goulash
        ports: ["5439:5432"]
        options: >-
          --health-cmd "pg_isready -U goulash" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make lint
      - run: make test
