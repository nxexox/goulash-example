services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: goulash
      POSTGRES_PASSWORD: goulash
      POSTGRES_DB: goulash
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goulash"]
      interval: 3s
      retries: 20

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://goulash:goulash@db:5432/goulash
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
