[project]
name = "goulash-suppliers"
version = "0.1.0"
description = "Поиск и сравнение поставщиков продуктов питания"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "snowballstemmer>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goulash"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["PoC"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends()/Form() defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
